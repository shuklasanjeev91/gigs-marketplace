<svg width="220" height="60" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6e56"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d6e56"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
  </defs>
  <!-- Left part of N -->
  <polygon points="4,8 16,8 40,36 40,48 28,48 4,20" fill="#0d6e56"/>
  <!-- Right part of N -->
  <polygon points="28,8 40,8 40,20 52,48 40,48 28,20" fill="url(#nGrad)"/>
  <!-- Diagonal slash accent -->
  <line x1="10" y1="42" x2="48" y2="14" stroke="url(#slashGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Circuit dot top-left -->
  <circle cx="8" cy="10" r="4.5" fill="#0d6e56"/>
  <!-- Circuit dot bottom-right -->
  <circle cx="50" cy="48" r="4.5" fill="#2dd4bf"/>
  <!-- Brand name -->
  <text x="66" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#0d6e56" letter-spacing="-0.5">neoelectron</text>
  <!-- Tagline -->
  <text x="66" y="45" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#4a7c6f" letter-spacing="0.3">Your freelance marketplace</text>
</svg>
